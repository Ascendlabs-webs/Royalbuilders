<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Royal Builders logo">
  <!-- Red arc background -->
  <path fill="#C41E3A" d="M40 356 A216 216 0 1 1 472 356 L436 356 A180 180 0 1 0 76 356 Z"/>

  <!-- Left skyscraper -->
  <g fill="#00205B">
    <rect x="148" y="126" width="40" height="200"/>
    <rect x="153" y="96" width="30" height="34"/>
    <rect x="153" y="84" width="30" height="16"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="154" y="140" width="6" height="176"/>
    <rect x="165" y="140" width="6" height="176"/>
    <rect x="176" y="140" width="6" height="176"/>
  </g>

  <!-- Right skyscraper (center, taller) -->
  <g fill="#00205B">
    <rect x="252" y="126" width="40" height="220"/>
    <rect x="257" y="96" width="30" height="34"/>
    <rect x="257" y="84" width="30" height="16"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="258" y="140" width="6" height="196"/>
    <rect x="269" y="140" width="6" height="196"/>
    <rect x="280" y="140" width="6" height="196"/>
  </g>

  <!-- Ground curve -->
  <path fill="#00205B" d="M120 342 Q256 310 392 342 L392 352 Q256 320 120 352 Z"/>

  <!-- House (foreground) -->
  <g>
    <!-- Roof with shingles -->
    <path fill="#00205B" d="M186 268 L282 232 L378 268 L378 280 L282 244 L186 280 Z"/>
    <!-- Shingle lines -->
    <g stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3">
      <path d="M186 270 L378 270"/>
      <path d="M188 276 L376 276"/>
      <path d="M190 282 L374 282"/>
    </g>
    <!-- Chimney -->
    <rect fill="#00205B" x="212" y="238" width="16" height="30"/>
    <!-- Walls -->
    <rect fill="#FFFFFF" x="196" y="278" width="172" height="64" stroke="#00205B" stroke-width="4"/>
    <!-- Door with W panel -->
    <rect fill="#0A1A33" x="266" y="296" width="32" height="46"/>
    <path d="M270 300 L282 330 L294 300 Z" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Windows -->
    <g>
      <rect fill="#0A1A33" x="208" y="296" width="34" height="26"/>
      <path stroke="#FFFFFF" stroke-width="2.5" d="M225 296 V322 M208 309 H242 M216.5 296 V322 M233.5 296 V322"/>
      <rect fill="#0A1A33" x="318" y="296" width="30" height="24"/>
      <path stroke="#FFFFFF" stroke-width="2.5" d="M333 296 V320 M318 308 H348 M325.5 296 V320 M340.5 296 V320"/>
    </g>
  </g>

  <!-- Wordmark: ROYAL BUILDERS in upright navy serif -->
  <text
    x="256"
    y="442"
    text-anchor="middle"
    font-family="'Times New Roman', Georgia, serif"
    font-size="78"
    font-weight="bold"
    font-style="normal"
    fill="#00205B"
  >ROYAL BUILDERS</text>

  <!-- Red divider line with diamond -->
  <path stroke="#C41E3A" stroke-width="3" d="M176 460 L336 460"/>
  <polygon fill="#C41E3A" points="256,454 261,460 256,466 251,460"/>
</svg>