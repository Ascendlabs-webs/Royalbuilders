<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Royal Builders logo">
  <!-- transparent background -->

  <defs>
    <style>
      .rb-red { fill: #C41E3A; }
      .rb-navy { fill: #00205B; }
      .rb-white { fill: #FFFFFF; }
    </style>
    <clipPath id="arcClip">
      <path d="M56 340 A200 200 0 1 1 456 340 Z"/>
    </clipPath>
  </defs>

  <!-- Red arc (semi-circle frame) -->
  <path class="rb-red" d="M40 356 A216 216 0 1 1 472 356 L436 356 A180 180 0 1 0 76 356 Z"/>

  <!-- Skyscraper (background, centered) -->
  <g class="rb-navy">
    <!-- spire -->
    <rect x="252.5" y="126" width="7" height="24"/>
    <!-- main tower body -->
    <rect x="216" y="150" width="80" height="196"/>
  </g>
  <!-- skyscraper window lines -->
  <g fill="#FFFFFF">
    <rect x="226" y="164" width="6" height="172"/>
    <rect x="242" y="164" width="6" height="172"/>
    <rect x="258" y="164" width="6" height="172"/>
    <rect x="274" y="164" width="6" height="172"/>
    <rect x="290" y="164" width="6" height="172"/>
  </g>

  <!-- Ground curve (dark blue) -->
  <path class="rb-navy" d="M120 342 Q256 310 392 342 L392 352 Q256 320 120 352 Z"/>

  <!-- House (foreground) -->
  <g>
    <!-- roof -->
    <path class="rb-navy" d="M186 268 L282 232 L378 268 L378 280 L282 244 L186 280 Z"/>
    <!-- chimney -->
    <rect class="rb-navy" x="212" y="238" width="16" height="30"/>
    <!-- walls -->
    <rect class="rb-navy" x="196" y="278" width="172" height="64"/>
    <!-- door (with W panel detail) -->
    <rect class="rb-white" x="266" y="296" width="32" height="46"/>
    <path d="M270 300 L282 330 L294 300 Z" fill="none" stroke="#00205B" stroke-width="3"/>
    <!-- windows: left grid window -->
    <g>
      <rect class="rb-white" x="208" y="296" width="34" height="26"/>
      <path stroke="#00205B" stroke-width="2.5" d="M225 296 V322 M208 309 H242 M216.5 296 V322 M233.5 296 V322"/>
    </g>
    <!-- windows: right two grid windows -->
    <g>
      <rect class="rb-white" x="318" y="296" width="30" height="24"/>
      <path stroke="#00205B" stroke-width="2.5" d="M333 296 V320 M318 308 H348 M325.5 296 V320 M340.5 296 V320"/>
      <rect class="rb-white" x="352" y="296" width="12" height="24"/>
      <path stroke="#00205B" stroke-width="2.5" d="M358 296 V320"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text
    x="256"
    y="438"
    text-anchor="middle"
    font-family="'Times New Roman', Georgia, serif"
    font-size="84"
    font-weight="bold"
    font-style="italic"
    class="rb-red"
  >Royal Builders</text>
</svg>
